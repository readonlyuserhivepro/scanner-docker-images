services:
  # 1. Initialise DB with Random Pass
  mariadb-configurator:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/mariadb-configurator:1.0
    restart: on-failure
    profiles:
      - aspm
    volumes:
      - mariadb_pass_vol:/shared
      # 2. Actual MariaDB
  hpmariadb:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/mariadb:10.4
    restart: always
    depends_on:
      mariadb-configurator:
        condition: service_completed_successfully
        restart: true
    profiles:
      - aspm
    environment:
      APP_VERSION: "6.5.0"
      # MARIADB_ROOT_PASSWORD_FILE: "" ### NOT REQUIRED UNLESS SUPPLYING PASSWORD EXTERNALLY VIA MOUNTED VOLUMES
    volumes:
      - mariadb_data_vol:/var/lib/mysql:Z
      - mariadb_pass_vol:/shared
    # ports:
    #   - 3306:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
  mariadbupdater:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/mariadb-updater:6.5.0
    restart: no
    profiles:
      - aspm
    depends_on:
      hpmariadb:
        condition: service_healthy
        # restart: true
    volumes:
      - mariadb_pass_vol:/shared
      # 3. Once DB is Up Check for Configs to SetUp other Tools
  dbconnector:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/dbconnector:1.0
    restart: no
    environment:
      DBHOST: "hpmariadb"
    profiles:
      - aspm
    depends_on:
      hpmariadb:
        condition: service_healthy
        restart: true
    volumes:
      - mariadb_pass_vol:/shared
      - mobsf_config_vol:/mobsf
      - zap_config_vol:/zap
      # 4. Once DBConnector Creates Necessary Startup Files Start Mobsf
  mobsf:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/mobsf:v3.9.7
    restart: always
    profiles:
      - aspm
    depends_on:
      dbconnector:
        condition: service_completed_successfully
        restart: true
    volumes:
      - mobsf_config_vol:/run/secrets
    # ports:
    #   - 8000:8000
    healthcheck:
      test: curl -f http://localhost:8000/login/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      # 5. Once DBConnector Creates Necessary Startup Files Start ZAP
  zap:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/zap:2.14.0
    restart: always
    profiles:
      - aspm
    depends_on:
      dbconnector:
        condition: service_completed_successfully
        restart: true
    environment:
      ZAP_PORT: 8812
      JMEM: "-XX:MaxRAMPercentage=50.0 -XshowSettings:vm"
    volumes:
      - zap_config_vol:/shared
      # ports:
      #   - 8812:8812
  # 6 SONARQUBE

  sonarqube:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/sonarqube:9.9.5-community
    restart: always
    profiles:
      - aspm
    depends_on:
      sonardb:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    # ports:
    #   - 9000:9000
    volumes:
      - sonarqube_data_vol:/opt/sonarqube/data
      - sonarqube_extensions_vol:/opt/sonarqube/extensions
      - sonarqube_logs_vol:/opt/sonarqube/logs
      - sonarqube_temp_vol:/opt/sonarqube/temp
  sonardb:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/postgres:15
    restart: always
    profiles:
      - aspm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    hostname: postgresql
    container_name: postgresql
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_vol:/var/lib/postgresql
      - postgresql_data_vol:/var/lib/postgresql/data
  burp:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/burp-suite-pro:2023.10.3.7
    restart: always
    profiles:
      - burp
    ports:
      - 9991:9991 # Burp API
      - 5900:5900 #VNC Client
      - 6080:6080 #Web VNC Client
      - 1337:1337
      - 8080:8080 #Burp Default Port
  genericagent:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/genericagent:2.0.5-38eb87a
    restart: always
    profiles:
      - aspm
    # user: root
    depends_on:
      zap:
        condition: service_started
        restart: true
      mobsf:
        condition: service_started
        restart: true
      sonarqube:
        condition: service_started
        restart: true
    cap_add:
      - NET_ADMIN # for capturing packages in promiscuous mode
      - NET_RAW # for raw sockets e.g. used for the boreas alive detection
    environment:
      CLIENTID: "${CLIENTID}"
      CLIENTSECRET: "${CLIENTSECRET}"
      UNI5XPOSUREHOST: "${UNI5XPOSUREHOST}"
      DBHOST: "hpmariadb"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - gvmd_socket_vol:/run/gvmd
      - mariadb_pass_vol:/shared
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9096:9096
      #7 HVS
  redis-server:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/redis-server:24
    profiles:
      - hvs
    restart: always
    volumes:
      - redis_socket_vol:/run/redis/
  pg-gvm:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/pg-gvm:22.6.10
    profiles:
      - hvs
    restart: always
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql
  vulnerability-tests:
    profiles:
      - hvs
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/vulnerability-tests
    volumes:
      - vt_data_vol:/mnt
  notus-data:
    profiles:
      - hvs
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/notus-data
    volumes:
      - notus_data_vol:/mnt
  scap-data:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/scap-data
    profiles:
      - hvs
    volumes:
      - scap_data_vol:/mnt
  data-objects:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/data-objects
    profiles:
      - hvs
    volumes:
      - data_objects_vol:/mnt
  cert-bund-data:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/cert-data
    profiles:
      - hvs
    volumes:
      - cert_data_vol:/mnt
  gpg-data:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/gpg-data
    profiles:
      - hvs
    volumes:
      - gpg_data_vol:/mnt
  gvmd:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/gvmd:26.6.0
    profiles:
      - hvs
    restart: always
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - type: volume
        source: data_objects_vol
        target: /var/lib/gvm/data-objects/gvmd
        volume:
          subpath: "22.04"
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - psql_socket_vol:/var/run/postgresql
      - shared-data:/shared
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_completed_successfully
      cert-bund-data:
        condition: service_completed_successfully
      data-objects:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_completed_successfully
  gsa:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/gsa:26.2.0
    profiles:
      - gbui
    restart: always
    ports:
      - 9392:80
    volumes:
      - gvmd_socket_vol:/run/gvmd
    depends_on:
      - gvmd
  # Sets log level of openvas to the set LOG_LEVEL within the env
  # and changes log output to /var/log/openvas instead /var/log/gvm
  # to reduce likelyhood of unwanted log interferences
  configure-openvas:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/openvas-scanner:23.30.1
    restart: on-failure
    profiles:
      - hvs
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\ntest_alive_hosts_only = yes\nmax_vts_timeouts = 5\n" > /mnt/openvas.conf
        sed "s/127/31/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log
  # shows logs of openvas
  openvas:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/openvas-scanner:23.30.1
    profiles:
      - hvs
    restart: always
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/openvas/openvas.conf
        tail -f /var/log/openvas/openvas.log
    depends_on:
      configure-openvas:
        condition: service_completed_successfully
  openvasd:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/openvas-scanner:23.8.2
    profiles:
      - hvs
    restart: always
    environment:
      # `service_notus` is set to disable everything but notus,
      # if you want to utilize openvasd directly removed `OPENVASD_MODE`
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    command:
      - /bin/sh
      - -c
      - |
        /usr/local/bin/openvasd  --ospd-socket /run/ospd/ospd-openvas.sock
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - gpg_data_vol:/etc/openvas/gnupg
    # enable port forwarding when you want to use the http api from your host machine
    # ports:
    #   - 127.0.0.1:3000:80
    depends_on:
      vulnerability-tests:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - openvasd
  ospd-openvas:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/ospd-openvas:22.9.0
    profiles:
      - hvs
    restart: always
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN # for capturing packages in promiscuous mode
      - NET_RAW # for raw sockets e.g. used for the boreas alive detection
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command: ["ospd-openvas", "-f", "--config", "/etc/gvm/ospd-openvas.conf", "--notus-feed-dir", "/var/lib/notus/advisories", "-m", "666"]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      redis-server:
        condition: service_started
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_completed_successfully
  gvm-tools:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/gvm-tools
    profiles:
      - hvs-tools
    volumes:
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
    depends_on:
      - gvmd
      - ospd-openvas
  index-fix:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/index-fix:1.1
    restart: always
    profiles:
      - hvs
    volumes:
      - psql_socket_vol:/var/run/postgresql
      - psql_data_vol:/var/lib/postgresql
    depends_on:
      - pg-gvm
  ovasagent:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/ovasagent:1.0.366-dev-f6be5189-f6be5189a1f4842db4eb65c81252c55f41db58fd
    restart: always
    profiles:
      - hvs
    ports:
      - 9081:9081
    environment:
      GVM_CLI_USERNAME: admin
      UNI5_API_URL: "${UNI5_API_URL}"
      UNI5_API_KEY: "${UNI5_API_KEY}"
      # API_KEY: "CreDridKotJafcicsIsBokGi"
      PROFILE: "production"
      HOST_IP: "${HOST_IP}"
      # SPRING_PROFILES_ACTIVE:"production" // For Setting the ACTIVE PROFILE
    volumes:
      - vt_data_vol:/var/lib/openvas/plugins:z
      - notus_data_vol:/var/lib/notus:z
      - gvmd_data_vol:/var/lib/gvm:z
      - scap_data_vol:/var/lib/gvm/scap-data:z
      - cert_data_vol:/var/lib/gvm/cert-data:z
      - type: volume
        source: data_objects_vol
        target: /var/lib/gvm/data-objects/gvmd
        volume:
          subpath: "22.04"
      - gvmd_socket_vol:/run/gvmd:z
      - ospd_openvas_socket_vol:/run/ospd:z
      - shared-data:/shared:z
      - ovasagent_vol:/data/kronos/ovasagent/data:z
    depends_on:
      gvmd:
        condition: service_started
  outboundagent:
    image: 767398110122.dkr.ecr.us-east-1.amazonaws.com/containerized-scanner-bundles/outboundagent:1.0.11399-dev-cc44a6ef-cc44a6ef2790673d52e22e9b5d60cd2763a6319a
    restart: always
    profiles:
      - outboundagent
    volumes:
      - shared-data:/shared:z
    environment:
      KRONOS_API_URL: "${UNI5_API_URL}"
      KRONOS_API_KEY: "${UNI5_API_KEY}"
      JAVA_OPTS: "-Doptions.package-manager.enabled=false -Dserver.address=127.0.0.1"
      # SPRING_PROFILES_ACTIVE: ""
      HOST_IP: "${HOST_IP}"
    ports:
      - 8081:8081
      - 8083:8083
volumes:
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  psql_socket_vol:
  gvmd_socket_vol:
  ospd_openvas_socket_vol:
  redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
  shared-data:
  mariadb_data_vol:
  mariadb_pass_vol:
  mobsf_config_vol:
  postgresql_vol:
  postgresql_data_vol:
  sonarqube_data_vol:
  sonarqube_extensions_vol:
  sonarqube_logs_vol:
  sonarqube_temp_vol:
  zap_config_vol:
  ovasagent_vol:
